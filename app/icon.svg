<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f7e9dc; }
    .ink { stroke: #d8bda2; }
    .accent { stroke: #a8622a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1a1614; }
      .ink { stroke: #3a2718; }
      .accent { stroke: #dc9048; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="100" height="100" rx="22" />

  <circle
    class="ink"
    cx="50" cy="50" r="25.83" fill="none" stroke-width="8"
    stroke-linecap="round" stroke-dasharray="162.35 162.35" transform="rotate(-90 50 50)"
  />
  <circle
    class="accent"
    cx="50" cy="50" r="25.83" fill="none" stroke-width="8"
    stroke-linecap="round" stroke-dasharray="116.89 162.35" transform="rotate(-90 50 50)"
  />

  <circle
    class="ink"
    cx="50" cy="50" r="11.685" fill="none" stroke-width="8"
    stroke-linecap="round" stroke-dasharray="73.42 73.42" transform="rotate(-90 50 50)"
  />
  <circle
    class="accent"
    cx="50" cy="50" r="11.685" fill="none" stroke-width="8"
    stroke-linecap="round" stroke-dasharray="30.84 73.42" transform="rotate(30 50 50)"
  />
</svg>
